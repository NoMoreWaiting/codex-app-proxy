name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Verify offline guide
        run: node tests/verify-start-here.mjs resources/START-HERE.html resources/default_config.json

      - name: Verify icon source
        shell: pwsh
        run: .\tests\verify-icon.ps1 -Path resources\windows\codex-proxy.ico

      # Only v* tags are release builds: TAG is v1.2.0 and VERSION is 1.2.0.
      # Branch pushes and PRs get a placeholder so "main" or "123/merge" never
      # ends up compiled into the exe.
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME
            $version = $tag.Substring(1)
          } else {
            $tag = ""
            $version = "0.0.0-dev"
          }
          # AppendAllText writes UTF-8 without BOM and in a single call, so the
          # env names are never polluted by a BOM.
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TAG=$tag`nVERSION=$version`n")
          Write-Host "TAG='$tag' VERSION='$version'"

      # Fail fast if the tag, the release notes and main.go disagree, instead of
      # discovering it after the build.
      - name: Check release prerequisites
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = ".github/releases/$($env:TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing release notes: $notes (create it before tagging)"
          }
          $match = Select-String -Path main.go -Pattern 'var version = "([^"]+)"'
          if (-not $match) { throw "Cannot find the default version in main.go" }
          $declared = $match.Matches[0].Groups[1].Value
          if ($declared -ne $env:VERSION) {
            throw "main.go declares $declared but the tag is $($env:TAG)"
          }

      - name: Build
        shell: pwsh
        run: |
          $ldflags = "-s -w -X main.version=$env:VERSION"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          go build -trimpath -ldflags $ldflags -o out\CodexProxyLauncher.exe .
          if ($LASTEXITCODE -ne 0) { throw "go build failed" }
          $reported = & .\out\CodexProxyLauncher.exe --version
          Write-Host "built: $reported"

      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Force resources\START-HERE.html out\
          Copy-Item -Force resources\default_config.json out\config.json
          Copy-Item -Force README.md out\

      - name: Verify package contents
        shell: pwsh
        run: .\tests\verify-package.ps1 -Path out

      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-app-proxy-windows-x64
          path: out/*
          if-no-files-found: error

      - name: Build release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $base = "ChatGPT-Codex-Proxy-Launcher-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = Join-Path dist "$base.zip"
          Compress-Archive -Path out\* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $base.zip" | Set-Content -Encoding ascii (Join-Path dist "$base.sha256")
          Expand-Archive -LiteralPath $zip -DestinationPath dist\verify
          .\tests\verify-package.ps1 -Path dist\verify

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $base = "ChatGPT-Codex-Proxy-Launcher-$tag-windows-x64"
          $notes = ".github/releases/$tag.md"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/$base.zip" "dist/$base.sha256" --clobber
          } else {
            gh release create $tag "dist/$base.zip" "dist/$base.sha256" `
              --title "$tag" `
              --notes-file $notes `
              --verify-tag
          }
